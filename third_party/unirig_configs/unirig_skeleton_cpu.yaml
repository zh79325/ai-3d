# UniRig 骨架预测 CPU 任务配置（复制自 configs/task/quick_inference_skeleton_articulationxl_ar_256.yaml）。
# 差异：trainer 改 CPU/fp32；ckpt 指本地离线权重；writer 关掉 FBX 导出（不装 bpy）。
# resume_from_checkpoint 为「相对项目根」路径，由 src/ai3d/retarget/unirig/predict.py
# 运行时 resolve 成绝对路径后覆写，勿依赖 cwd。
mode: predict
debug: False
experiment_name: quick_inference_skeleton_articulationxl_ar_256
resume_from_checkpoint: models/unirig/skeleton_articulationxl_256.ckpt

components:
  data: quick_inference
  tokenizer: tokenizer_parts_articulationxl_256
  transform: inference_ar_transform
  model: unirig_ar_350m_1024_81920_float32
  system: ar_inference_articulationxl
  data_name: raw_data.npz

writer:
  __target__: ar
  output_dir: ~ # export results into the same input folder
  add_num: False
  repeat: 1
  export_npz: predict_skeleton
  export_obj: skeleton
  export_fbx: ~ # 不装 bpy，跳过 FBX；消费 npz

trainer:
  max_epochs: 1
  num_nodes: 1
  devices: 1
  precision: 32
  accelerator: cpu
  strategy: auto
