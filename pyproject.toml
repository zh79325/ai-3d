[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai3d"
version = "0.1.0"
description = "基于 YOLO26 的单目视频 3D 动画生成工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wukong AI Assistant"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ultralytics>=8.2.0",
    "rtmlib>=0.0.13",
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "pygltflib>=1.16.2",
    "scipy>=1.10.0",
    "libigl>=2.5.0",
    "python-multipart>=0.0.9",
    # UniRig 骨架蒙皮新链路依赖（进程内 import，CPU 推理）
    "transformers==4.51.3",
    "python-box>=7.0",
    "einops>=0.8",
    "omegaconf>=2.3",
    "pytorch_lightning>=2.0",
    "lightning>=2.0",
    "addict>=2.4",
    "timm>=1.0",
    "fast-simplification>=0.1.7",
    "trimesh>=4.0",
    "open3d>=0.18",
    "huggingface_hub>=0.25",
    "wandb>=0.16",
    "torch_scatter>=2.1",
    "torch_cluster>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]
export = [
    "trimesh>=4.0",
    "pycollada>=0.7",
]
retarget = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
]

# torch_scatter/torch_cluster 在 macOS arm64 无 wheel，须源码编译；
# 其 setup.py 在构建期 import torch 但未声明 build 依赖，必须关闭构建隔离
[tool.uv]
no-build-isolation-package = ["torch-scatter", "torch-cluster"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
